<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./a.css" />

    <title>Document</title>
    <body>
      <div class="dashboard">
        <div class="sidebar">
          <h2>Dashboard</h2>
          <p>Home</p>
          <p>Analytics</p>
          <p>Orders</p>
        </div>

        <div class="header">
          <h1>Dashboard</h1>
          <input type="text" placeholder="Search" />
          <p>Profile</p>
        </div>

        <div class="main">
          <h2>Welcome</h2>

          <div class="cards">
            <div class="card">Users</div>
            <div class="card">Revenue</div>
            <div class="card">Orders</div>
            <div class="card">Growth</div>
            <!-- Chart Section -->
            <div class="content">
              <div class="chart">
                <h2>Revenue Chart</h2>
                <div class="chart-box">
                  <div class="bar bar1"></div>
                  <div class="bar bar2"></div>
                  <div class="bar bar3"></div>
                  <div class="bar bar4"></div>
                </div>
              </div>

              <!-- Activity Panel -->
              <div class="activity">
                <h2>Recent Activity</h2>

                <p>New user registered</p>
                <p>New order received</p>
                <p>Payment completed</p>
                <p>Order shipped</p>
              </div>
            </div>

            <!-- Table -->
            <div class="table-section">
              <h2>Recent Orders</h2>

              <table>
                <tr>
                  <th>Order ID</th>
                  <th>Customer</th>
                  <th>Status</th>
                </tr>

                <tr>
                  <td>101</td>
                  <td>Rahul</td>
                  <td>Completed</td>
                </tr>

                <tr>
                  <td>102</td>
                  <td>Ananya</td>
                  <td>Pending</td>
                </tr>

                <tr>
                  <td>103</td>
                  <td>Rohan</td>
                  <td>Shipped</td>
                </tr>
              </table>
            </div>
          </div>
        </div>
      </div>
    </body>
  </head>
</html>
